<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Vertex Collision</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/authStyle.css">
</head>
<body>
    <header>
        <h1>Vertex Collision</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="login.html" id="nav-login">Iniciar Sesión</a>
        </nav>
    </header>

    <main class="contenedor-auth">
        <form id="form-registro" class="formulario-caja">
            <h2>Crear Cuenta</h2>
            <p>Únete a Vertex Collision para gestionar tus pedidos.</p>
            
            <div class="grupo-input">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="grupo-input">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo-input">
                <label for="telefono">Teléfono (Celular)</label>
                <input type="tel" id="telefono" required placeholder="10 dígitos">
            </div>

            <div class="grupo-input">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>

            <button type="submit" class="btn-primario-grande">Registrarme</button>
            <p class="enlace-auth">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </form>
    </main>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
