<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador | Vertex Collision</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header>
        <h1>Vertex Collision <span style="color: white; font-size: 1rem;">| Admin</span></h1>
        <nav>
            <a href="index.html">Volver a la Tienda</a>
            <a href="#" id="btn-cerrar-sesion-admin">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="contenedor-admin">
        <!-- Menú lateral / superior para navegar en el admin -->
        <aside class="menu-admin">
            <button class="tab-btn activo" data-target="seccion-productos">📦 Gestionar Productos</button>
            <button class="tab-btn" data-target="seccion-pedidos">🛒 Consultar Pedidos</button>
            <button class="tab-btn" data-target="seccion-usuarios">👥 Administrar Usuarios</button>
        </aside>

        <!-- Área de contenido dinámico -->
        <section class="contenido-admin">
            
            <!-- SECCIÓN: PRODUCTOS E INVENTARIO -->
            <div id="seccion-productos" class="admin-panel activo">
                <div class="panel-header-admin">
                    <h2>Inventario de Productos</h2>
                    <button id="btn-nuevo-producto" class="btn-primario-grande" style="width: auto; padding: 10px 20px;">+ Nuevo Producto</button>
                </div>
                <div class="tabla-responsiva">
                    <table class="tabla-admin">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body-productos">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SECCIÓN: PEDIDOS GLOBALES -->
            <div id="seccion-pedidos" class="admin-panel">
                <h2>Todos los Pedidos</h2>
                <div class="tabla-responsiva">
                    <table class="tabla-admin">
                        <thead>
                            <tr>
                                <th>Nº Pedido</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body-pedidos">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SECCIÓN: USUARIOS -->
            <div id="seccion-usuarios" class="admin-panel">
                <h2>Usuarios Registrados</h2>
                <div class="tabla-responsiva">
                    <table class="tabla-admin">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Teléfono</th>
                                <th>Rol</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body-usuarios">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal para Agregar/Modificar Producto -->
    <div id="modal-producto" class="modal-oculto">
        <div class="modal-contenido">
            <h3 id="modal-titulo">Agregar Producto</h3>
            <form id="form-admin-producto">
                <input type="hidden" id="admin-prod-id">
                
                <div class="grupo-input">
                    <label>Nombre del Producto</label>
                    <input type="text" id="admin-prod-nombre" required>
                </div>
                
                <div class="modal-grid">
                    <div class="grupo-input">
                        <label>Precio (MXN)</label>
                        <input type="number" step="0.01" id="admin-prod-precio" required>
                    </div>
                    <div class="grupo-input">
                        <label>Stock (Inventario)</label>
                        <input type="number" id="admin-prod-stock" required>
                    </div>
                </div>

                <div class="modal-grid">
                    <div class="grupo-input">
                        <label>Categoría</label>
                        <input type="text" id="admin-prod-categoria" required>
                    </div>
                    <div class="grupo-input">
                        <label>Marca</label>
                        <input type="text" id="admin-prod-marca" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label>Número de Parte (SKU)</label>
                    <input type="text" id="admin-prod-numero">
                </div>

                <div class="grupo-input">
                    <label>Descripción</label>
                    <input type="text" id="admin-prod-desc">
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btn-cancelar-modal" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario-grande" style="margin-top:0;">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-pedido" class="modal-oculto">
        <div class="modal-contenido">
            <h3>Modificar Estado del Pedido</h3>
            <form id="form-admin-pedido">
                <input type="hidden" id="admin-ped-id">
                
                <div class="grupo-input">
                    <label>Estado actual del pedido</label>
                    <select id="admin-ped-estado" required>
                        <option value="Procesado">Procesado</option>
                        <option value="Enviado">Enviado</option>
                        <option value="Entregado">Entregado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btn-cancelar-modal-ped" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario-grande" style="margin-top:0;">Actualizar Estado</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
