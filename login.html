<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Vertex Collision</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/authStyle.css">
</head>
<body>
    <header>
        <h1>Vertex Collision</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="registro.html" id="nav-login">Registrarse</a>
        </nav>
    </header>

    <main class="contenedor-auth">
        <form id="form-login" class="formulario-caja">
            <h2>Bienvenido de nuevo</h2>
            
            <div class="grupo-input">
                <label for="correo-login">Correo Electrónico</label>
                <input type="email" id="correo-login" required>
            </div>

            <div class="grupo-input">
                <label for="contrasena-login">Contraseña</label>
                <input type="password" id="contrasena-login" required>
            </div>

            <button type="submit" class="btn-primario-grande">Ingresar</button>
            <p class="enlace-auth">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </form>
    </main>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
